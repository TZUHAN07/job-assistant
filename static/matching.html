<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>匹配度分析 · Job Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .score-ring {
        --score: 0;
        --color: #10b981;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: conic-gradient(
          var(--color) calc(var(--score) * 3.6deg),
          #e5e7eb 0
        );
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .score-ring::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: white;
      }
      .score-ring span {
        position: relative;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
      <header id="header" class="mb-8">
      </header>
     
      <main id="content">
      </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/matching.js"></script>
  </body>
</html>
