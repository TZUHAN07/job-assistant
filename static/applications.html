<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>求職追蹤 · Job Assistant</title>
  <link rel="icon" type="image/svg+xml" href="job-icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    select[data-status-id] { appearance: none; -webkit-appearance: none; background-image: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <main class="max-w-6xl mx-auto px-4 py-8 sm:px-6">
    <nav aria-label="主導覽" class="mb-6"><a href="index.html" class="text-indigo-600 hover:underline">← 返回 Job Assistant</a></nav>
    <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div><h1 class="text-3xl font-bold">求職追蹤</h1><p class="text-sm text-gray-500 mt-2">查看匹配度、投遞進度與選用的求職信版本</p></div>
      <button id="reload" type="button" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-wait">重新整理</button>
    </header>
    <p id="summary" class="text-sm text-gray-500 mb-3" role="status"></p>
    <section id="applications-content" aria-label="求職追蹤列表" aria-busy="false" class="bg-white rounded-lg shadow overflow-hidden"></section>
    <nav id="pagination" aria-label="列表分頁" class="flex flex-wrap items-center justify-between gap-3 mt-5" hidden>
      <p id="page-info" class="text-sm text-gray-500"></p>
      <div class="flex gap-2">
        <button id="previous" type="button" class="border rounded-lg px-4 py-2 bg-white hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">上一頁</button>
        <button id="next" type="button" class="border rounded-lg px-4 py-2 bg-white hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">下一頁</button>
      </div>
    </nav>
  </main>
  <dialog id="edit-dialog" aria-labelledby="edit-title" class="rounded-xl p-0 w-full max-w-lg backdrop:bg-black/40">
    <form id="edit-form" class="p-6">
      <h2 id="edit-title" class="text-xl font-bold">編輯求職追蹤</h2>
      <p id="edit-context" class="text-sm text-gray-500 mt-2 mb-5 break-words"></p>
      <fieldset id="edit-fields" class="space-y-4 disabled:opacity-60">
        <div id="date-field"><label for="edit-date" class="block text-sm font-medium mb-1">投遞日期</label><input id="edit-date" type="date" class="w-full border rounded-lg p-2" aria-describedby="date-help" /><p id="date-help" class="text-xs text-gray-500 mt-1">可留空；修改狀態不會自動填入日期。</p></div>
        <div id="notes-field"><label for="edit-notes" class="block text-sm font-medium mb-1">備註</label><textarea id="edit-notes" rows="4" class="w-full border rounded-lg p-2" placeholder="例如：下週追蹤面試結果"></textarea></div>
      </fieldset>
      <p id="edit-error" role="alert" class="text-sm text-red-700 mt-3"></p>
      <div class="flex justify-end gap-3 mt-5"><button id="edit-cancel" type="button" class="border rounded-lg px-4 py-2 disabled:opacity-50">取消</button><button id="edit-save" type="submit" class="bg-indigo-600 text-white rounded-lg px-4 py-2 disabled:opacity-50">儲存</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description" class="rounded-xl p-0 w-full max-w-md backdrop:bg-black/40">
    <form id="delete-form" class="p-6">
      <h2 id="delete-title" class="text-xl font-bold">刪除這筆求職紀錄？</h2>
      <p id="delete-context" class="mt-3 text-sm break-words"></p>
      <p id="delete-description" class="mt-3 text-sm text-gray-500">刪除後無法復原，不會刪除你的履歷與求職信。</p>
      <p id="delete-error" role="alert" class="mt-3 text-sm text-red-700"></p>
      <div class="flex justify-end gap-3 mt-5">
        <button id="delete-cancel" type="button" class="border rounded-lg px-4 py-2 disabled:opacity-50">取消</button>
        <button id="delete-confirm" type="submit" class="bg-red-600 hover:bg-red-700 text-white rounded-lg px-4 py-2 disabled:opacity-50">刪除紀錄</button>
      </div>
    </form>
  </dialog>
  <script src="js/common.js"></script>
  <script src="js/applications.js"></script>
</body>
</html>
