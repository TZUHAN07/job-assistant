<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 · Job Assistant</title>
  <link rel="icon" type="image/svg+xml" href="job-icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-md bg-white rounded-xl border border-gray-200 p-8 shadow-sm">
    <p class="text-indigo-700 font-semibold mb-2">Job Assistant</p>
    <h1 class="text-2xl font-bold text-gray-900">登入你的求職助手</h1>
    <p class="mt-2 mb-6 text-sm text-gray-600">管理履歷、追蹤求職進度，準備下一場面試。</p>
    <form id="login-form" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required maxlength="254" class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <p id="login-error" role="alert" class="text-sm text-red-700" hidden></p>
      <button id="login-submit" type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-medium text-white hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-60">登入</button>
    </form>
  </main>
  <script src="js/login.js?v=auth-1"></script>
</body>
</html>
