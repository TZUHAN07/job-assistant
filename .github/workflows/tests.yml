name: Tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobassistant_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: job_assistant_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U jobassistant_test -d job_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 只連到這次 job 的暫存資料庫；不使用 repository secrets。
      TEST_DATABASE_URL: postgresql+asyncpg://jobassistant_test:test_only_password@127.0.0.1:5434/job_assistant_test
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests without external services
        # 不傳 --run-live；conftest 也會將模型／爬蟲金鑰換成測試值。
        run: python -m pytest -q -m "not live"
